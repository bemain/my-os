---
name: Build bootc image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 04 * * *" # 04:30 UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_DESC: "My customized Fedora Silverblue image"
  IMAGE_REGISTRY: "quay.io/${{ github.repository_owner }}"
  ARTIFACTHUB_LOGO_URL: "https://avatars.githubusercontent.com/u/45990342?v=4"
  DEFAULT_TAG: "latest" 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Rechunking holds the image twice in container storage, which exceeds the runner's default free space
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # By default, it should generate "latest" and "latest.(date here)".
          tags: |
            type=raw,value=latest
            type=raw,value=latest.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=latest
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=bootc,fedora,silverblue
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.ARTIFACTHUB_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false

      # Splits the image into per-package layers so updates only download what changed.
      # --previous-build keeps the layer plan stable across builds, but errors on an image that was never chunked.
      # --rootfs drops labels, so they are reapplied.
      - name: Rechunk Image
        env:
          LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail
          IMAGE="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          GRAPHROOT="$(podman info --format '{{ .Store.GraphRoot }}')"
          label_args=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && label_args+=(--label "$label")
          done <<< "$LABELS"
          PREVIOUS="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          previous_args=()
          if skopeo inspect --raw "$PREVIOUS" | jq -e 'any(.layers[]; .annotations["ostree.components"])' > /dev/null; then
            previous_args=(--previous-build "$PREVIOUS")
          fi
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="${IMAGE}",target=/rpm-ostree \
            --mount=type=bind,src="${GRAPHROOT}",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "${IMAGE}" \
            compose build-chunked-oci \
            --max-layers 128 \
            --format-version=2 \
            --bootc \
            --rootfs /rpm-ostree \
            "${previous_args[@]}" \
            "${label_args[@]}" \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]${IMAGE}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            podman tag "${IMAGE}" "localhost/${IMAGE_NAME}:${tag}"
          done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to Quay Container Registry
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push To Quay
        uses: redhat-actions/push-to-registry@v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ secrets.QUAY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: "v3.1.3"

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
